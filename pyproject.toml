[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duo-host"
version = "0.1.0"
description = "Windows host prototype for the Duo wired iPad display"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
runtime = ["pymobiledevice3>=4", "dxcam>=0.0.5", "Pillow>=10"]

[project.scripts]
duo-host = "duo_host.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["duo_host*"]
