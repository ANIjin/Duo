name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  ipad-simulator:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build iPad simulator app
        run: >
          xcodebuild -project ipad/DuoClient.xcodeproj
          -scheme DuoClient -sdk iphonesimulator
          -configuration Debug build CODE_SIGNING_ALLOWED=NO

  ipad-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned device app
        run: >
          xcodebuild -project ipad/DuoClient.xcodeproj
          -scheme DuoClient -configuration Release
          -sdk iphoneos build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/device-build"
      - name: Package unsigned IPA artifact
        run: |
          APP_PATH="$RUNNER_TEMP/device-build/DuoClient.app"
          test -f "$APP_PATH/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          test -n "$EXECUTABLE"
          test -f "$APP_PATH/$EXECUTABLE"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/DuoClient-unsigned.ipa"
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoClient-unsigned-ipa-${{ github.sha }}
          path: ${{ runner.temp }}/DuoClient-unsigned.ipa
          if-no-files-found: error
