name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  ipad-simulator:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build iPad simulator app
        run: >
          xcodebuild -project ipad/DuoClient.xcodeproj
          -scheme DuoClient -sdk iphonesimulator
          -configuration Debug build CODE_SIGNING_ALLOWED=NO

  ipad-ipa:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    runs-on: macos-14
    environment: ios-release
    steps:
      - uses: actions/checkout@v4
      - name: Validate signing inputs
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          PROVISION_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          test -n "$CERTIFICATE_BASE64" || { echo "Missing IOS_CERTIFICATE_BASE64"; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "Missing IOS_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$PROVISION_PROFILE_BASE64" || { echo "Missing IOS_PROVISION_PROFILE_BASE64"; exit 1; }
          test -n "$PROVISION_PROFILE_NAME" || { echo "Missing IOS_PROVISIONING_PROFILE_NAME"; exit 1; }
          test -n "$TEAM_ID" || { echo "Missing IOS_TEAM_ID"; exit 1; }
          test -n "$KEYCHAIN_PASSWORD" || { echo "Missing IOS_KEYCHAIN_PASSWORD"; exit 1; }
          test -n "$EXPORT_OPTIONS_PLIST_BASE64" || { echo "Missing IOS_EXPORT_OPTIONS_PLIST_BASE64"; exit 1; }
      - name: Import signing certificate and profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" -o "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
      - name: Archive signed app
        run: >
          xcodebuild -project ipad/DuoClient.xcodeproj
          -scheme DuoClient -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/DuoClient.xcarchive"
          archive
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}"
          PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}"
          CODE_SIGN_IDENTITY="Apple Distribution"
      - name: Export IPA
        env:
          EXPORT_OPTIONS_PLIST: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          test -n "$EXPORT_OPTIONS_PLIST" || { echo "Missing IOS_EXPORT_OPTIONS_PLIST_BASE64"; exit 1; }
          echo "$EXPORT_OPTIONS_PLIST" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DuoClient.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
      - name: Upload sideloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: DuoClient-ipa-${{ github.sha }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
